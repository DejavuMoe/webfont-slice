labels:
  platform: linux/amd64
  backend: docker
  role: netcup-nano
  server: netcup-nano

when:
  - event: push
    branch: master
  - event: manual

steps:
  - name: build
    image: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    environment:
      pnpm_config_verify_deps_before_run: 'false'
    commands:
      - apk add --no-cache git
      - npm install --global pnpm@11.24.0
      - pnpm install --frozen-lockfile --prefer-offline
      - pnpm run check
      - sh scripts/verify-dist.sh dist

  - name: publish
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    volumes:
      - /var/www/webfont.zsh.moe:/deploy
    commands:
      - apk add --no-cache coreutils util-linux
      - reruns="$CI_PIPELINE_RERUNS"; test -n "$reruns" || reruns=0; release_id="$CI_COMMIT_SHA-$CI_PIPELINE_NUMBER-$reruns"; sh scripts/publish-dist.sh dist "$release_id"

concurrency:
  limit: 1
  group: webfont-production
